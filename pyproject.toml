[project]
name = "depot"
version = "0.1.0"
description = "Internal inventory and orders service for a small retailer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "deptry>=0.20",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C90"]

[tool.ruff.lint.mccabe]
# Cyclomatic complexity gate (C901); keep functions small.
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
# FastAPI's dependency-injection pattern needs function decorators to keep signatures.
plugins = []
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--durations=10 -p no:cacheprovider"

[tool.deptry]
# DEP002 is expected for deps used indirectly or by upcoming stories:
# uvicorn runs the server; sqlalchemy/alembic/pydantic are exercised from story 1 on.
known_first_party = ["app"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "sqlalchemy", "alembic", "pydantic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
