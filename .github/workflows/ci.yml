name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Guard scripts (file size + TODO policy)
        run: |
          scripts/check_file_size.sh
          scripts/check_todos.sh
      - name: AGENTS.md/README make targets exist
        run: scripts/check_agents_md.sh
      - name: Unused dependencies (deptry)
        run: uv run deptry .
      - name: Duplicate code (jscpd)
        run: npx --yes jscpd@latest --silent .
      - name: Make targets work
        run: make lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Tests (coverage gate, timing, parallel)
        run: make test
